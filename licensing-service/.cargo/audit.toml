# cargo-audit configuration.
#
# RUSTSEC-2023-0071 (rsa "Marvin Attack" timing sidechannel) has no fixed
# release. `rsa` is NOT compiled into the daemon: it only ever entered the tree
# via sqlx's MySQL driver, which we do not use (sqlx is sqlite-only,
# default-features = false). After the sqlx 0.7 -> 0.8 bump neither `rsa` nor
# `sqlx-mysql` appears in `cargo tree -i rsa --target all -e all`; they linger
# only as orphaned Cargo.lock entries. So this advisory is not reachable in our
# build. Re-check (and drop this ignore) if a real dependency on `rsa` ever
# appears in the tree.
[advisories]
ignore = ["RUSTSEC-2023-0071"]
